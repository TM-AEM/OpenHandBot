name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Static check (pyflakes, all first-party modules)
        # OHB2-PHASE1E: pyflakes بقى يغطّي automation/ و tools/ كمان (كان bot/ main.py tests/ بس).
        # pyflakes بيفحص ثابت (AST) من غير استيراد/تنفيذ ⇒ مفيش تشغيل لأتمتة/autopush.
        run: python -m pyflakes bot/ automation/ tools/ main.py tests/
      - name: Dependency audit (pip-audit)
        # OHB2-PHASE1E: SCA على requirements-dev.txt (بيسحب requirements.txt). بيفشل عند أي
        # ثغرة معروفة. محتاج شبكة (advisory DB) — متوفّرة على GitHub runners.
        run: python -m pip_audit -r requirements-dev.txt
      - name: SAST (bandit, runtime code)
        # OHB2-PHASE1E: فحص أمني ثابت لكود التشغيل (bot/ + main.py) عند severity عالي فقط.
        # B613 (محارف bidi) مستثنى عمدًا: المشروع عربي والتعليقات فيها علامات RTL مقصودة
        # (مش trojan-source) — شوف docs/OPERATIONS_RUNBOOK.md. باقي نتائج bandit منخفضة/متوسطة
        # وكلها إيجابيات كاذبة موثّقة (SQL مُعامَل، bind-all مقصود، try/except pass مقصود).
        run: python -m bandit -r bot/ main.py -lll -s B613
      - name: Tests (pytest)
        run: python -m pytest -q

  frontend:
    name: Frontend tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend tests (node --test)
        run: node --test tests/frontend/*.test.js
