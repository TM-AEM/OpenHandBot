name: Verify agent branch

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Full 40-character lowercase commit SHA to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate requested SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve and validate SHA
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            sha="${INPUT_HEAD_SHA}"
          else
            sha="${PUSH_SHA}"
          fi
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha must be a full 40-character lowercase hex commit SHA"
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

  python:
    name: Python ${{ matrix.python-version }} checks
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Verify checked-out SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${REQUESTED_SHA}" ]]; then
            echo "::error::checked-out SHA ${actual} does not match requested ${REQUESTED_SHA}"
            exit 1
          fi
          git cat-file -e "${REQUESTED_SHA}^{commit}"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Static check (pyflakes)
        run: python -m pyflakes bot/ automation/ tools/ main.py tests/
      - name: Dependency audit (pip-audit)
        run: python -m pip_audit -r requirements-dev.txt
      - name: SAST (bandit)
        run: python -m bandit -r bot/ automation/ tools/ main.py -lll -s B613
      - name: Tests (pytest)
        run: python -m pytest -q

  frontend:
    name: Frontend tests (Node)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Verify checked-out SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${REQUESTED_SHA}" ]]; then
            echo "::error::checked-out SHA ${actual} does not match requested ${REQUESTED_SHA}"
            exit 1
          fi
          git cat-file -e "${REQUESTED_SHA}^{commit}"
      - name: Set up Node.js 24 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend dependencies (npm ci)
        run: npm ci
      - name: Frontend tests (node --test)
        run: node --test tests/frontend/*.test.js
      - name: Frontend build
        run: npm run build
      - name: Frontend lint
        run: npm run lint
