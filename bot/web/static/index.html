<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0f172a">
    <title>OpenHandBot</title>
    <!-- OHB2-MINIAPP: SDK الرسمي لتيليجرام. لازم يتحمّل قبل app.js عشان `Telegram.WebApp`
         (و`initData`) يكونوا موجودين جوه عميل تيليجرام الحقيقي (أندرويد/ديسكتوب/ويب).
         من غيره الواجهة بتشوف initData فاضي ⇒ مصادقة تفشل. مسموح في CSP عبر telegram.org. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/mini/styles.css?v=5">
  </head>
  <body>
    <main class="app" id="app" aria-busy="true">
      <header class="topbar">
        <span class="brand">OpenHandBot</span>
        <span class="user" id="user-name" hidden></span>
      </header>

      <section class="state" id="state-loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>بيتم التحميل…</p>
      </section>

      <section class="state" id="state-error" hidden role="alert">
        <div class="icon" aria-hidden="true">⚠️</div>
        <h2 class="state-title">تعذّر فتح التطبيق</h2>
        <p class="state-msg" id="error-msg">حصل خطأ غير متوقع.</p>
        <button class="btn" id="retry-btn" type="button">إعادة المحاولة</button>
      </section>

      <section class="content" id="state-ready" hidden>
        <nav class="tabs" role="tablist">
          <button class="tab" type="button" data-view="chats" role="tab">الشاتات</button>
          <button class="tab" type="button" data-view="watches" role="tab">المتابعات</button>
          <button class="tab" type="button" data-view="inbox" role="tab">الإشعارات <span class="badge" id="inbox-badge" hidden></span></button>
          <button class="tab" type="button" data-view="new" role="tab">شات جديد</button>
          <button class="tab" type="button" data-view="settings" role="tab">الإعدادات</button>
        </nav>

        <div class="view" id="view-chats">
          <div class="toolbar">
            <button class="btn ghost" type="button" id="chats-refresh">تحديث</button>
          </div>
          <ul class="list" id="chats-list"></ul>
          <div class="more" id="chats-more" hidden>
            <button class="btn ghost" type="button" id="chats-next">المزيد</button>
          </div>
        </div>

        <div class="view" id="view-detail" hidden></div>

        <div class="view" id="view-watches" hidden>
          <div class="toolbar">
            <button class="btn ghost" type="button" id="watches-refresh">تحديث</button>
          </div>
          <ul class="list" id="watches-list"></ul>
        </div>

        <div class="view" id="view-inbox" hidden>
          <div class="toolbar">
            <button class="btn ghost" type="button" id="inbox-refresh">تحديث</button>
            <button class="btn ghost" type="button" id="inbox-read-all">تعليم الكل كمقروء</button>
          </div>
          <div class="filter-bar">
            <button class="chip active" type="button" id="inbox-filter-all" data-filter="all">الكل</button>
            <button class="chip" type="button" id="inbox-filter-unread" data-filter="unread">غير المقروء</button>
            <button class="chip" type="button" id="inbox-filter-archived" data-filter="archived">المؤرشف</button>
          </div>
          <ul class="list" id="inbox-list"></ul>
          <div class="more" id="inbox-more" hidden>
            <button class="btn ghost" type="button" id="inbox-next">المزيد</button>
          </div>
        </div>

        <div class="view" id="view-new" hidden>
          <div class="field">
            <input class="input" type="search" id="repo-search" placeholder="ابحث عن مستودع…" autocomplete="off">
            <button class="btn ghost" type="button" id="repo-search-btn">بحث</button>
          </div>
          <div class="field">
            <button class="btn ghost" type="button" id="newchat-norepo">🚫 ابدأ بدون مستودع</button>
          </div>
          <ul class="list" id="repo-list"></ul>
          <div class="newchat-form" id="newchat-form" hidden>
            <p class="hint" id="newchat-repo"></p>
            <textarea class="textarea" id="newchat-text" rows="4" placeholder="اكتب البرومت اللي عايز تبدأ بيه الشات…"></textarea>
            <button class="btn" type="button" id="newchat-send">ابدأ الشات</button>
            <div class="op-box" id="newchat-op"></div>
          </div>
        </div>

        <div class="view" id="view-settings" hidden>
          <div class="card row">
            <span class="card-label">الإشعارات الاستباقية</span>
            <button class="btn small" type="button" id="notif-toggle">—</button>
          </div>
          <p class="hint">الإشعارات بتيجي من البوت على تيليجرام لما أي شات يوصل لحالة نهائية.</p>
        </div>
      </section>

      <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
    </main>

    <script src="/mini/ops.js?v=6" defer></script>
    <script src="/mini/inbox.js?v=6" defer></script>
    <script src="/mini/files.js?v=6" defer></script>
    <script src="/mini/cost.js?v=6" defer></script>
    <script src="/mini/copy.js?v=6" defer></script>
    <script src="/mini/export.js?v=6" defer></script>
    <script src="/mini/app.js?v=6" defer></script>
  </body>
</html>
